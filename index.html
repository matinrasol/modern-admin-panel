<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | مدرن</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#fff8e9;font-family:Tahoma,Arial,sans-serif;padding:22px}.wrap{max-width:1100px;margin:auto}.panel{background:#17120d;border:1px solid #9d762f;border-radius:16px;padding:20px;margin:16px 0}h1,h2{color:#ffd477;margin-top:0}input,textarea,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #9d762f}input,textarea{display:block;background:#090807;color:white;width:100%;margin:8px 0 14px}button{background:#eab34c;color:#1a1207;font-weight:bold;cursor:pointer}button.secondary{background:#27211a;color:#fff8e9}.muted{color:#cfc3ad}.hidden{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}label{display:block;color:#e8d8b9}.order{border-top:1px solid #5e4725;padding:14px 0}.status{display:inline-block;padding:4px 9px;border:1px solid #9d762f;border-radius:20px}#message,#formMsg{white-space:pre-wrap}.hint{font-size:.85rem;color:#cfc3ad}@media(max-width:600px){body{padding:10px}.panel{padding:14px}}
</style></head><body><div class="wrap"><h1>پنل مدیریت کابینت‌سازی مدرن</h1><p class="muted">ورود امن با حساب Appwrite</p>
<section id="login" class="panel"><h2>ورود مدیر</h2><label>ایمیل حساب Appwrite<input id="email" type="email" autocomplete="username"></label><label>رمز عبور حساب Appwrite<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn">ورود</button><p id="loginMsg" class="muted"></p></section>
<section id="dashboard" class="hidden">
<div class="panel"><h2>ثبت سفارش جدید</h2><p class="hint">اطلاعات سفارش را وارد کن؛ کد سفارش خودکار ساخته می‌شود.</p>
<form id="orderForm"><div class="grid">
<label>نام مشتری<input name="customer_name" required maxlength="120"></label><label>شماره تلفن<input name="customer_phone" required inputmode="tel" maxlength="30"></label>
<label>نوع پروژه<input name="project_type" required placeholder="مثلاً کابینت آشپزخانه"></label><label>متراژ<input name="metrage" type="number" min="0" step="0.01" required></label>
<label>جنس<input name="material" placeholder="مثلاً MDF"></label><label>رنگ<input name="color"></label>
<label>مبلغ کل (تومان)<input id="total" name="total_amount" type="number" min="0" required></label><label>پیش‌پرداخت (تومان)<input id="advance" name="advance_amount" type="number" min="0" value="0" required></label>
<label>مانده (تومان)<input id="remaining" type="number" readonly value="0"></label><label>توضیحات<textarea name="notes" rows="2"></textarea></label></div>
<button id="submitOrder" type="submit">ثبت سفارش</button> <span id="formMsg" class="muted"></span></form></div>
<div class="panel"><div class="row"><div><h2>سفارش‌ها</h2><p class="muted">فهرست سفارش‌های ثبت‌شده</p></div><div style="text-align:left"><button class="secondary" id="refreshBtn">بروزرسانی</button> <button class="secondary" id="logoutBtn">خروج</button></div></div><p id="message" class="muted"></p><div id="orders"></div></div>
</section></div>
<script type="module">
import {Client,Account,Functions} from "https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm";
const PROJECT_ID="6b06fba3002e5671322a",ENDPOINT="https://fra.cloud.appwrite.io/v1",FUNCTION_ID="6b071397000d0f8037d8";
const client=new Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID),account=new Account(client),functions=new Functions(client),$=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function runApi(path,method="GET",data={}){const x=await functions.createExecution(FUNCTION_ID,method==="GET"?"":JSON.stringify(data),false,path,method,{"content-type":"application/json"});let r;try{r=JSON.parse(x.responseBody||"{}")}catch{throw Error("پاسخ تابع قابل خواندن نیست")}if(x.statusCode<200||x.statusCode>=300||r.ok===false)throw Error(r.error||r.message||("خطای تابع: "+x.statusCode));return r}
function renderOrders(a){if(!Array.isArray(a)||!a.length){$("orders").innerHTML='<p class="muted">هنوز سفارشی ثبت نشده است.</p>';return}$("orders").innerHTML=a.map(o=>`<article class="order"><h3>${esc(o.order_code||o.$id||"سفارش")}</h3><p>مشتری: ${esc(o.customer_name)} | تلفن: ${esc(o.customer_phone)}</p><p>نوع پروژه: ${esc(o.project_type)} | متراژ: ${esc(o.metrage)}</p><p>جنس: ${esc(o.material)} | رنگ: ${esc(o.color)}</p><p>مبلغ کل: ${esc(o.total_amount)} | پیش‌پرداخت: ${esc(o.advance_amount)} | مانده: ${esc(o.remaining_amount)}</p><p>وضعیت: <span class="status">${esc(o.status)}</span></p><p class="muted">${esc(o.notes||"")}</p></article>`).join("")}
async function loadOrders(){$("message").textContent="در حال دریافت سفارش‌ها…";try{const d=await runApi("/orders");renderOrders(d.orders||[]);$("message").textContent=""}catch(e){$("message").textContent="دریافت سفارش‌ها ناموفق بود: "+e.message}}
function updateRemaining(){const t=Number($("total").value)||0,a=Number($("advance").value)||0;$("remaining").value=Math.max(0,t-a)}
$("total").addEventListener("input",updateRemaining);$("advance").addEventListener("input",updateRemaining);
$("orderForm").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget;const f=new FormData(form),t=Number(f.get("total_amount")),a=Number(f.get("advance_amount"));if(a>t){$("formMsg").textContent="پیش‌پرداخت نمی‌تواند بیشتر از مبلغ کل باشد.";return}
const code="MOD-"+Date.now().toString(36).toUpperCase(),data={customer_name:String(f.get("customer_name")).trim(),customer_phone:String(f.get("customer_phone")).trim(),project_type:String(f.get("project_type")).trim(),metrage:Number(f.get("metrage")),material:String(f.get("material")).trim(),color:String(f.get("color")).trim(),total_amount:Math.round(t),advance_amount:Math.round(a),remaining_amount:Math.round(t-a),status:"pending",order_code:code,notes:String(f.get("notes")).trim()};
$("formMsg").textContent="در حال ثبت سفارش…";$("submitOrder").disabled=true;try{const r=await runApi("/orders","POST",data);$("formMsg").textContent="سفارش ثبت شد: "+(r.order?.order_code||code);form.reset();$("advance").value="0";updateRemaining();await loadOrders()}catch(err){$("formMsg").textContent="ثبت سفارش ناموفق بود: "+err.message}finally{$("submitOrder").disabled=false}});
$("loginBtn").addEventListener("click",async()=>{$("loginMsg").textContent="در حال ورود…";try{await account.createEmailPasswordSession($("email").value.trim(),$("password").value);$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");await loadOrders()}catch(e){$("loginMsg").textContent=e.message||"ورود ناموفق بود."}});
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});$("refreshBtn").addEventListener("click",loadOrders);$("logoutBtn").addEventListener("click",async()=>{try{await account.deleteSession("current")}catch{}location.reload()});
try{await account.get();$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");await loadOrders()}catch{}
</script></body></html>
