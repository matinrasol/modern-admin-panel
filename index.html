<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>پنل مدیریت | مدرن</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0b0907;color:#fff8e9;font-family:Tahoma,Arial,sans-serif;padding:22px}
    .wrap{max-width:1100px;margin:auto}
    .panel{background:#17120d;border:1px solid #9d762f;border-radius:16px;padding:20px;margin:16px 0}
    h1,h2{color:#ffd477;margin-top:0}
    input,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #9d762f}
    input{display:block;background:#090807;color:white;width:100%;margin:8px 0 14px}
    button{background:#eab34c;color:#1a1207;font-weight:bold;cursor:pointer}
    button.secondary{background:#27211a;color:#fff8e9}
    .muted{color:#cfc3ad}.hidden{display:none}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .row>*{flex:1}
    .order{border-top:1px solid #5e4725;padding:14px 0}
    .status{display:inline-block;padding:4px 9px;border:1px solid #9d762f;border-radius:20px}
    #message{white-space:pre-wrap}
    @media(max-width:600px){body{padding:10px}.panel{padding:14px}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>پنل مدیریت کابینت‌سازی مدرن</h1>
  <p class="muted">ورود امن با حساب Appwrite</p>

  <section id="login" class="panel">
    <h2>ورود مدیر</h2>
    <label>ایمیل حساب Appwrite</label>
    <input id="email" type="email" autocomplete="username" placeholder="ایمیل حساب">
    <label>رمز عبور حساب Appwrite</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور">
    <button id="loginBtn">ورود</button>
    <p id="loginMsg" class="muted"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <div class="row">
        <div><h2>سفارش‌ها</h2><p class="muted">فهرست سفارش‌های ثبت‌شده</p></div>
        <div style="text-align:left">
          <button class="secondary" id="refreshBtn">بروزرسانی</button>
          <button class="secondary" id="logoutBtn">خروج</button>
        </div>
      </div>
      <p id="message" class="muted"></p>
      <div id="orders"></div>
    </div>
  </section>
</div>

<script type="module">
  import { Client, Account, Functions } from "https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm";

  const PROJECT_ID = "6b06fba3002e5671322a";
  const ENDPOINT = "https://fra.cloud.appwrite.io/v1";
  const FUNCTION_ID = "6b071397000d0f8037d8";

  const client = new Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID);
  const account = new Account(client);
  const functions = new Functions(client);
  const $ = id => document.getElementById(id);

  function showMessage(text){ $("message").textContent = text || ""; }
  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }

  async function runApi(path, method = "GET", data = {}) {
    const execution = await functions.createExecution(
      FUNCTION_ID,
      method === "GET" ? "" : JSON.stringify(data),
      false,
      path,
      method,
      {"content-type":"application/json"}
    );
    let result;
    try { result = JSON.parse(execution.responseBody || "{}"); }
    catch { throw new Error("پاسخ تابع قابل خواندن نیست: " + (execution.responseBody || "")); }
    if (execution.statusCode < 200 || execution.statusCode >= 300 || result.ok === false) {
      throw new Error(result.error || result.message || ("خطای تابع: " + execution.statusCode));
    }
    return result;
  }

  function renderOrders(items){
    if(!Array.isArray(items) || items.length === 0){
      $("orders").innerHTML = '<p class="muted">هنوز سفارشی ثبت نشده است.</p>';
      return;
    }
    $("orders").innerHTML = items.map(order => `
      <article class="order">
        <h3>${escapeHtml(order.order_code || order.$id || "سفارش")}</h3>
        <p>مشتری: ${escapeHtml(order.customer_name)}</p>
        <p>تلفن: ${escapeHtml(order.customer_phone)}</p>
        <p>نوع پروژه: ${escapeHtml(order.project_type)}</p>
        <p>متراژ: ${escapeHtml(order.metrage)}</p>
        <p>جنس: ${escapeHtml(order.material)} | رنگ: ${escapeHtml(order.color)}</p>
        <p>مبلغ کل: ${escapeHtml(order.total_amount)} | پیش‌پرداخت: ${escapeHtml(order.advance_amount)}</p>
        <p>وضعیت: <span class="status">${escapeHtml(order.status)}</span></p>
        <p class="muted">${escapeHtml(order.notes || "")}</p>
      </article>
    `).join("");
  }

  async function loadOrders(){
    showMessage("در حال دریافت سفارش‌ها…");
    $("orders").innerHTML = "";
    try {
      const data = await runApi("/orders", "GET");
      renderOrders(data.orders || []);
      showMessage("");
    } catch(error) {
      showMessage("دریافت سفارش‌ها ناموفق بود:\n" + error.message);
    }
  }

  $("loginBtn").addEventListener("click", async () => {
    $("loginMsg").textContent = "در حال ورود…";
    try {
      await account.createEmailPasswordSession($("email").value.trim(), $("password").value);
      $("login").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      await loadOrders();
    } catch(error) {
      $("loginMsg").textContent = error.message || "ورود ناموفق بود.";
    }
  });

  $("password").addEventListener("keydown", event => {
    if(event.key === "Enter") $("loginBtn").click();
  });
  $("refreshBtn").addEventListener("click", loadOrders);
  $("logoutBtn").addEventListener("click", async () => {
    try { await account.deleteSession("current"); } catch {}
    location.reload();
  });

  try {
    await account.get();
    $("login").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    await loadOrders();
  } catch {}
</script>
</body>
</html>
